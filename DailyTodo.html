<div id="todo-wrap">
  <h2>TODOリスト</h2>

  <div class="row">
    <input id="todo-no" type="number" placeholder="No">
    <input id="todo-input" type="text" placeholder="TODO">
    <button type="button" id="todo-add-btn">ADD</button>
  </div>

  <ul id="todo-list"></ul>
</div>

<style>
#todo-wrap{
  max-width:820px;
  margin:20px auto;
  padding:16px;
  border:1px solid #ddd;
  border-radius:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Courier New',monospace;
  background:#fff;
  box-sizing:border-box;
}
#todo-wrap h2{margin:0 0 12px;font-size:24px}
#todo-wrap .row{display:flex;gap:8px;flex-wrap:wrap}
#todo-wrap input[type=text],
#todo-wrap input[type=number]{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}
#todo-wrap #todo-no{width:90px}
#todo-wrap #todo-input{flex:1;min-width:220px}
#todo-wrap button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:#fff;
}
#todo-wrap #todo-list{list-style:none;padding:0;margin:14px 0 0}
#todo-wrap #todo-list li.item{
  display:grid;
  grid-template-columns:28px 70px 1fr 160px;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
#todo-wrap #todo-list li.item span.task{overflow-wrap:anywhere}
#todo-wrap #todo-list li.item span.no{font-weight:bold;color:#444}
#todo-wrap #todo-list li.item.done span.task,
#todo-wrap #todo-list li.item.done span.no{
  text-decoration:line-through;
  color:#888;
}
#todo-wrap .actions{display:flex;gap:6px;flex-wrap:wrap}
#todo-wrap .del{background:#f3f3f3;color:#333}
#todo-wrap .move{background:#f3f3f3;color:#333;padding:10px 10px}
#todo-wrap .head{
  display:grid;
  grid-template-columns:28px 70px 1fr 160px;
  gap:10px;
  padding:8px 0;
  border-bottom:2px solid #ddd;
  font-weight:bold;
  color:#555;
}
#todo-wrap .star-btn{
  width:28px;
  height:28px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f3f3;
  color:#333;
}
@media (max-width:640px){
  #todo-wrap #todo-list li.item,
  #todo-wrap .head{
    grid-template-columns:28px 70px 1fr;
  }
  #todo-wrap .head div:nth-child(4),
  #todo-wrap #todo-list li.item .actions{
    grid-column:3;
  }
}
</style>

<script>
(function(){
  const KEY='simple_wp_todos';
  const RESET_KEY='simple_wp_todos_last_reset';

  function loadTodos(){
    try{
      return JSON.parse(localStorage.getItem(KEY) || '[]');
    }catch(e){
      return [];
    }
  }

  let todos = loadTodos();

  function save(){
    localStorage.setItem(KEY, JSON.stringify(todos));
    render();
    setNextNo();
  }

  function getEl(id){
    return document.getElementById(id);
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function getTodayKey(){
    const d=new Date();
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function resetDoneAfterSix(){
    const now=new Date();
    const todayKey=getTodayKey();
    const lastReset=localStorage.getItem(RESET_KEY);

    if(now.getHours() < 6) return;
    if(lastReset === todayKey) return;

    todos=todos.map(t=>({...t, done:false}));
    localStorage.setItem(RESET_KEY, todayKey);
    localStorage.setItem(KEY, JSON.stringify(todos));
  }

  function getNextNo(){
    if(!todos.length) return 1;
    return Math.max(...todos.map(t => Number(t.no) || 0)) + 1;
  }

  function setNextNo(){
    const noEl=getEl('todo-no');
    if(!noEl) return;
    noEl.value=getNextNo();
  }

  function addTodo(){
    const noEl=getEl('todo-no');
    const inputEl=getEl('todo-input');

    if(!noEl || !inputEl) return;

    const text=inputEl.value.trim();
    if(!text) return;

    const no=Number(noEl.value) || getNextNo();

    todos.push({
      id: Date.now() + Math.floor(Math.random()*1000),
      no: no,
      text: text,
      done: false,
      star: false
    });

    inputEl.value='';

    save();
  }

  function toggleTodo(id){
    todos=todos.map(t=>t.id===id ? {...t, done:!t.done} : t);
    save();
  }

  function delTodo(id){
    const t=todos.find(x=>x.id===id);
    if(t && t.star) return;
    todos=todos.filter(t=>t.id!==id);
    save();
  }

  function toggleStar(id){
    todos=todos.map(t=>t.id===id ? {...t, star:!t.star} : t);
    save();
  }

  function editTodo(id){
    const t=todos.find(x=>x.id===id);
    if(!t) return;

    const v=window.prompt('TODOをEDT', t.text);
    if(v===null) return;

    const nv=v.trim();
    if(!nv) return;

    todos=todos.map(x=>x.id===id ? {...x, text:nv} : x);
    save();
  }

  function moveTodo(id, direction){
    const index=todos.findIndex(t=>t.id===id);
    if(index<0) return;

    const targetIndex=direction==='up' ? index-1 : index+1;
    if(targetIndex<0 || targetIndex>=todos.length) return;

    const temp=todos[index];
    todos[index]=todos[targetIndex];
    todos[targetIndex]=temp;

    save();
  }

  function render(){
    const listEl=getEl('todo-list');
    if(!listEl) return;

    listEl.innerHTML=
      `<li class="head">
         <div>★</div>
         <div>No</div>
         <div>TODO</div>
         <div>OPERATION</div>
       </li>` +
      todos.map(t =>
        `<li class="item ${t.done ? 'done' : ''}">
          <button type="button" class="star-btn" data-action="star" data-id="${t.id}">${t.star ? '★' : '☆'}</button>
          <span class="no">${escapeHtml(t.no || '')}</span>
          <span class="task">
            <input type="checkbox" data-action="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''}>
            ${escapeHtml(t.text)}
          </span>
          <div class="actions">
            <button type="button" class="move" data-action="up" data-id="${t.id}">↑</button>
            <button type="button" class="move" data-action="down" data-id="${t.id}">↓</button>
            <button type="button" class="del" data-action="edit" data-id="${t.id}">EDT</button>
            <button type="button" class="del" data-action="delete" data-id="${t.id}" ${t.star ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>DEL</button>
          </div>
        </li>`
      ).join('');
  }

  function bindEvents(){
    const inputEl=getEl('todo-input');
    const addBtn=getEl('todo-add-btn');
    const listEl=getEl('todo-list');

    if(inputEl){
      inputEl.addEventListener('keydown', function(e){
        if(e.key==='Enter') addTodo();
      });
    }

    if(addBtn){
      addBtn.addEventListener('click', addTodo);
    }

    if(listEl){
      listEl.addEventListener('click', function(e){
        const btn=e.target.closest('[data-action]');
        if(!btn) return;

        const action=btn.getAttribute('data-action');
        const id=Number(btn.getAttribute('data-id'));
        if(!id) return;

        if(action==='star') toggleStar(id);
        if(action==='edit') editTodo(id);
        if(action==='delete') delTodo(id);
        if(action==='up') moveTodo(id,'up');
        if(action==='down') moveTodo(id,'down');
      });

      listEl.addEventListener('change', function(e){
        const el=e.target.closest('[data-action="toggle"]');
        if(!el) return;

        const id=Number(el.getAttribute('data-id'));
        if(!id) return;

        toggleTodo(id);
      });
    }
  }

  function init(){
    if(!getEl('todo-wrap')) return;
    resetDoneAfterSix();
    bindEvents();
    render();
    setNextNo();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }
})();
</script>
